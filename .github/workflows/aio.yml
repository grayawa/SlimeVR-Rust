name: SlimeVR AIO Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aio-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  backend:
    uses: ./.github/workflows/build-backend.yml
  gpui:
    needs: backend
    uses: ./.github/workflows/windows-app.yml
    with:
      app: GPUI
  tauri:
    needs: backend
    uses: ./.github/workflows/windows-app.yml
    with:
      app: Tauri
  overlay:
    uses: ./.github/workflows/windows-app.yml
    with:
      app: Overlay
  package:
    name: Assemble release AIO
    needs: [checks, gpui, tauri, overlay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: SlimeVR-*-Windows-x64
          path: dist
          merge-multiple: true
      - run: python gui/scripts/package-aio.py --directory dist --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeVR-AIO-Windows-x64
          path: |
            dist/SlimeVR-AIO-Windows-x64.zip
            dist/SlimeVR-AIO-Windows-x64.zip.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
