name: Web GUI and workflow checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-checks:
    name: Gui Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Get tags
        run: git fetch --tags origin --recurse-submodules=no --force
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' > "$RUNNER_TEMP/actionlint.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check actionlint.sha256 && tar -xzf actionlint.tar.gz actionlint)
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: GUI Lint
        run: pnpm install --frozen-lockfile && cd gui && pnpm lint

  build-gui-frontend:
    name: Build GUI Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Get tags
        run: git fetch --tags origin --recurse-submodules=no --force
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Build JS
        env:
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile && cd gui && pnpm web:build
      - name: Tar GUI Dist
        run: tar -czf slimevr-gui-dist.tar.gz -C gui/dist .
      - name: Upload GUI Dist
        uses: actions/upload-artifact@v7
        with:
          name: gui-dist
          path: slimevr-gui-dist.tar.gz
