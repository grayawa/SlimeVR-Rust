name: Linux GPUI build implementation
on:
  workflow_call:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  build:
    name: Linux GPUI x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake ninja-build pkg-config libfontconfig-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan-dev libudev-dev libssl-dev mesa-vulkan-drivers xvfb x11-utils imagemagick dbus-x11
          echo 'CXX=g++-14' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server-rust -> target
            gui-gpui -> target
          key: linux-gpui-x64
          cache-on-failure: true
      - name: Build Rust backend
        run: cargo build --manifest-path server-rust/Cargo.toml --release --locked --bin slimevr-server
      - name: Prepare desktop resources
        run: |
          python gui/scripts/fetch-steamvr-drivers.py
          python gui/scripts/build-bindings-provider.py
      - name: Build native desktop and diagnostics
        run: cargo build --manifest-path gui-gpui/Cargo.toml --release --locked --bin slimevr-gpui --bin slimevr-gpui-components --bin slimevr-gpui-probe
      - name: Native GPUI checks
        run: |
          cargo clippy --manifest-path gui-gpui/Cargo.toml --workspace --release --all-targets --locked -- -D warnings
          cargo test --manifest-path gui-gpui/Cargo.toml --release --lib --locked
          dbus-run-session -- cargo test --manifest-path gui-gpui/Cargo.toml --release --test linux_tray --locked -- --ignored
      - name: Real-backend loopback
        env:
          SLIMEVR_TEST_BACKEND: ${{ github.workspace }}/server-rust/target/release/slimevr-server
        run: cargo test --manifest-path gui-gpui/Cargo.toml --release --test backend --locked -- --ignored
      - name: Native X11 rendering smoke test
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python gui-gpui/scripts/test-native-linux.py --components gui-gpui/target/release/slimevr-gpui-components --output dist/linux-smoke
      - name: Package Linux GPUI
        run: python gui-gpui/scripts/package-linux.py --gui gui-gpui/target/release/slimevr-gpui --components gui-gpui/target/release/slimevr-gpui-components --probe gui-gpui/target/release/slimevr-gpui-probe --server server-rust/target/release/slimevr-server --audit-system-libs --build-revision "$GITHUB_SHA" --output dist/SlimeVR-GPUI-Linux-x64.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: SlimeVR-GPUI-Linux-x64
          path: |
            dist/SlimeVR-GPUI-Linux-x64.tar.gz
            dist/SlimeVR-GPUI-Linux-x64.tar.gz.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SlimeVR-GPUI-Linux-smoke
          path: dist/linux-smoke/
          retention-days: 14
          if-no-files-found: ignore
