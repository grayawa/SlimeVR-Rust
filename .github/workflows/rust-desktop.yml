name: Rust and Tauri test bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rust-desktop.yml'
      - 'server-rust/**'
      - 'gui/**'
      - 'solarxr-protocol/**'
      - 'bindings-provider/**'
      - '.gitmodules'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: rust-desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(github.event_name == 'pull_request' && '["windows-latest"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      VITE_DESKTOP_VERSION: '0.1.0'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14 cmake ninja-build pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf
      - if: runner.os == 'Linux'
        run: echo "CXX=g++-14" >> "$GITHUB_ENV"
      - uses: lukka/get-cmake@latest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server-rust -> target
            gui/src-tauri -> target
          key: tauri-${{ matrix.os }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Rust checks
        run: |
          cargo test --manifest-path server-rust/Cargo.toml --workspace --locked
          cargo clippy --manifest-path server-rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Frontend checks
        working-directory: gui
        run: |
          pnpm typecheck
          pnpm test:desktop
          pnpm test:backend
      - name: Build host bundle
        working-directory: gui
        run: pnpm tauri:rust:build
      - name: Desktop host checks
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml --locked
      - uses: actions/upload-artifact@v7
        with:
          name: slimevr-rust-tauri-${{ matrix.os }}
          path: |
            gui/src-tauri/target/release/bundle/**
            server-rust/target/release/slimevr-server
            server-rust/target/release/slimevr-server.exe
          if-no-files-found: error
