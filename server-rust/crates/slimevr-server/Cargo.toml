[package]
name = "slimevr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
slimevr-core = { path = "../slimevr-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "sync", "io-util", "process"] }
if-addrs = "0.15"
solarxr_protocol = { path = "../../../solarxr-protocol/protocol/rust" }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
tempfile = "3"
serde_yaml_ng = "0.10"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

serialport = { version = "4.9", default-features = false }
sha2 = "0.10"
md-5 = "0.10"
hidapi = { version = "=2.6.6", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
rosc = "0.11"
mdns-sd = "0.17"

espflash = { version = "=4.4.0", default-features = false, features = ["serialport"] }

[dev-dependencies]
prost-types = "0.14"
tempfile = "3"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
